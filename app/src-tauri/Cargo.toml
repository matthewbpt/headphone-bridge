[package]
name = "headphone-bridge"
version = "0.3.0"
description = "Headphone Bridge for desktop and Android: the Tauri shell around the core"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "headphone_bridge_lib"
crate-type = ["lib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
headphone-bridge-core = { path = "../../crates/core" }
serde.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tokio.workspace = true
uuid.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
headphone-bridge-platform-android = { path = "../../crates/platform-android" }
jni = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
headphone-bridge-platform-macos = { path = "../../crates/platform-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
headphone-bridge-platform-linux = { path = "../../crates/platform-linux" }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
