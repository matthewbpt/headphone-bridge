[package]
name = "headphone-bridge"
version = "1.1.0"
description = "Headphone Bridge for desktop and Android: the Tauri shell around the core"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "headphone_bridge_lib"
crate-type = ["lib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
headphone-bridge-core = { path = "../../crates/core" }
# Only debug builds use it; Cargo has no debug-only dependency (ADR-0006).
headphone-bridge-simulated = { path = "../../crates/simulated" }
anyhow = "1"
serde.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tokio.workspace = true
uuid.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
headphone-bridge-platform-android = { path = "../../crates/platform-android" }
jni = "0.21"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
headphone-bridge-platform-macos = { path = "../../crates/platform-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
headphone-bridge-platform-linux = { path = "../../crates/platform-linux" }

[dev-dependencies]
serde_json = "1"
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
