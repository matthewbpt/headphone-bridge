[package]
name = "headphone-bridge-platform-android"
version = "1.0.0"
description = "Headphone Bridge's Android platform adapter: the core's host, talking JSON over JNI to a Kotlin side that owns Bluetooth"
edition.workspace = true
license.workspace = true
repository.workspace = true
# tauri-plugin's build script needs `links`, and it names the Gradle project.
links = "headphone-bridge-platform-android"

[dependencies]
headphone-bridge-core = { path = "../core" }
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread"] }
uuid.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tauri = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time", "test-util"] }

[lints]
workspace = true
