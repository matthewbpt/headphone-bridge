name: Commits

on:
  pull_request:
    # edited: re-check the title when it's renamed.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  conventional-commits:
    # Runs the same check as the local commit-msg hook on every commit in the PR,
    # so commits made with --no-verify or without the hook still get checked.
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit message in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          msg_file=$(mktemp)
          for sha in $(git rev-list --reverse "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$msg_file"
            if ! sh .githooks/commit-msg "$msg_file"; then
              echo "::error::Commit $(git rev-parse --short "$sha") does not follow Conventional Commits"
              status=1
            fi
          done
          exit "$status"
      # The hook sees only the message; this sees the files each commit touches.
      - name: Check each commit's scope covers the files it touches
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commit-scopes "$BASE_SHA" "$HEAD_SHA"

  pr-title:
    # PRs are squash-merged, so the title becomes the header of the one commit
    # that lands on main, which release-please reads to pick the next version.
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          msg_file=$(mktemp)
          printf '%s\n' "$TITLE" > "$msg_file"
          if ! sh .githooks/commit-msg "$msg_file"; then
            echo "::error::The PR title does not follow Conventional Commits"
            exit 1
          fi
      - name: Check the PR title's scope covers the whole diff
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commit-scopes --title "$TITLE" "$BASE_SHA" "$HEAD_SHA"

  glossary:
    # Terms GLOSSARY.md lists under Avoid, in the lines the PR adds and its
    # commit messages. scripts/check-glossary says which terms it checks.
    name: Glossary terms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the PR's added lines and commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-glossary "$BASE_SHA" "$HEAD_SHA"
