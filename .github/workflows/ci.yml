name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  repo-checks:
    # Rules from docs/agents that a script can check without building.
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/check-error-docs
      - run: scripts/check-release-config

  core:
    # The platform-independent crates must build and pass on every OS (ADR-0002).
    # The Tauri shell is excluded: it needs per-OS system libraries, so the Linux app job covers it.
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux adapter's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libpulse-dev pkg-config
      # Each OS lints its own adapter's cfg-gated code.
      - run: cargo clippy --workspace --exclude headphone-bridge --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude headphone-bridge --locked

  linux-app:
    # The whole app on Linux: lints and tests the shell and the Linux adapter,
    # then bundles the deb and AppImage.
    name: Linux app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Tauri's and the Linux adapter's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev libpulse-dev pkg-config file
      - run: npm ci
        working-directory: app
      # Builds the UI, which the shell embeds.
      - run: npm run build
        working-directory: app
      - run: cargo clippy -p headphone-bridge -p headphone-bridge-platform-linux -p headphone-bridge-platform-android --all-targets --locked -- -D warnings
      - run: cargo test -p headphone-bridge --locked
      - run: npm run tauri build -- --bundles deb,appimage
        working-directory: app
      - uses: actions/upload-artifact@v7
        with:
          name: headphone-bridge-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  macos-app:
    # The shell's macOS-only code, which no other job compiles: the core job
    # skips the shell, and clippy can't check it from Linux, as a dependency's
    # build script needs a macOS C compiler.
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # Builds the UI, which the shell embeds.
      - run: npm run build
        working-directory: app
      - run: cargo clippy -p headphone-bridge --all-targets --locked -- -D warnings
      - run: cargo test -p headphone-bridge --locked

  android-app:
    # The Android app as a debug APK, so Android build breaks show up before
    # merging, then the Kotlin tests and lint. It needs no Linux system
    # libraries: the shell's desktop parts aren't built for Android.
    name: Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The Android-only code, which no other job compiles. Clippy doesn't
      # link, so it needs no NDK, and it fails fast, before the APK build.
      - run: cargo clippy -p headphone-bridge -p headphone-bridge-platform-android --target aarch64-linux-android --all-targets --locked -- -D warnings
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: app
      - run: npx tauri android build --debug --apk --target aarch64
        working-directory: app
      # The Kotlin JVM tests and Android lint, after the build, which
      # generates the :tauri-android project they depend on.
      - run: ./gradlew :headphone-bridge-platform-android:testDebugUnitTest :headphone-bridge-platform-android:lintDebug
        working-directory: app/src-tauri/gen/android
      - uses: actions/upload-artifact@v7
        with:
          name: headphone-bridge-android-debug
          path: app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk

  kotlin:
    # The Android plugin's hand-written Kotlin, not the generated app under
    # app/src-tauri/gen. Rules: crates/platform-android/android/.editorconfig
    # (ktlint) and detekt.yml.
    name: Kotlin lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/platform-android/android
    env:
      KTLINT_VERSION: 1.8.0
      DETEKT_VERSION: 1.23.8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install ktlint and detekt
        run: |
          curl -sSLo "$RUNNER_TEMP/ktlint" "https://github.com/pinterest/ktlint/releases/download/$KTLINT_VERSION/ktlint"
          chmod +x "$RUNNER_TEMP/ktlint"
          curl -sSLo "$RUNNER_TEMP/detekt-cli.jar" "https://github.com/detekt/detekt/releases/download/v$DETEKT_VERSION/detekt-cli-$DETEKT_VERSION-all.jar"
      - run: '"$RUNNER_TEMP/ktlint" "src/**/*.kt" "*.kts"'
      - run: java -jar "$RUNNER_TEMP/detekt-cli.jar" --config detekt.yml --input src

  ui:
    name: UI typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
