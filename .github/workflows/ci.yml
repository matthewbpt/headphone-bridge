name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The platform-independent crates must build and pass on every OS (ADR-0002).
    # The Tauri shell is excluded: it needs per-OS system libraries, so the Linux app job covers it.
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux adapter's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libpulse-dev pkg-config
      - run: cargo test --workspace --exclude headphone-bridge --locked

  linux-app:
    # The whole app on Linux: lints and tests the shell and the Linux adapter,
    # then bundles the deb and AppImage.
    name: Linux app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Tauri's and the Linux adapter's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev libpulse-dev pkg-config file
      - run: npm ci
        working-directory: app
      # Builds the UI, which the shell embeds.
      - run: npm run build
        working-directory: app
      - run: cargo clippy -p headphone-bridge -p headphone-bridge-platform-linux -p headphone-bridge-platform-android --all-targets --locked -- -D warnings
      - run: cargo test -p headphone-bridge --locked
      - run: npm run tauri build -- --bundles deb,appimage
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: headphone-bridge-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  android-app:
    # The Android app as a debug APK, so Android build breaks show up before
    # merging, then the Kotlin tests and lint. It needs no Linux system
    # libraries: the shell's desktop parts aren't built for Android.
    name: Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: app
      - run: npx tauri android build --debug --apk --target aarch64
        working-directory: app
      # The Kotlin JVM tests and Android lint, after the build, which
      # generates the :tauri-android project they depend on.
      - run: ./gradlew :headphone-bridge-platform-android:testDebugUnitTest :headphone-bridge-platform-android:lintDebug
        working-directory: app/src-tauri/gen/android
      - uses: actions/upload-artifact@v4
        with:
          name: headphone-bridge-android-debug
          path: app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk

  ui:
    name: UI typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
